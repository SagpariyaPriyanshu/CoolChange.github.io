name: Deploy Backend

# Fully automatic, same as deploy-frontend.yml. No checkout step needed —
# nothing in the repo is read locally; the actual code pull happens on
# the EC2 instance itself, triggered remotely via SSM.
on:
  push:
    branches: [development]
    paths:
      - "backend/**"
  workflow_dispatch: {}

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-4

      # Runs on the instance itself via SSM Run Command — no SSH, no
      # security group changes needed (matches how ci_deploy_policy.tf
      # scopes this role: ssm:SendCommand / ssm:GetCommandInvocation
      # only, nothing SSH-shaped). SSM's agent executes this as root, so
      # the git/npm steps are explicitly run as the unprivileged
      # `coolchange` user instead (via sudo -u), keeping file ownership
      # under /opt/coolchange consistent with what user_data.sh.tpl set
      # up at boot — only the final systemctl restart, which genuinely
      # needs root, runs as root.
      - name: Trigger deploy via SSM
        run: |
          SCRIPT=$(cat <<'EOF'
          set -euo pipefail
          sudo -u coolchange -H bash -c '
            set -euo pipefail
            cd /opt/coolchange/app
            git fetch origin development
            git reset --hard origin/development
            cd backend
            npm ci --omit=dev
          '
          systemctl restart coolchange-backend
          sleep 3
          systemctl is-active --quiet coolchange-backend
          EOF
          )

          # Built as a real JSON file rather than passed through --parameters
          # shorthand syntax: the CLI's shorthand parser doesn't actually
          # parse nested JSON, so a jq-built array string handed to it that
          # way was being taken as one literal string — brackets, quotes,
          # escaped \n and all — instead of a real list with real newlines.
          # That's what silently produced the malformed one-line script
          # (ResponseCode 127, "command not found") behind the runs that
          # looked stuck at Pending. file:// forces genuine JSON parsing.
          jq -n --arg script "$SCRIPT" '{commands: [$script]}' > /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ vars.BACKEND_INSTANCE_ID }}" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          # Polls up to 5 minutes (30 x 10s) — SendCommand is fire-and-forget
          # on its own, so without this the workflow would report success
          # the instant the command was *submitted*, not once the deploy
          # actually finished (or failed).
          for i in $(seq 1 30); do
            # The assignment itself must be the if's condition (negated) —
            # this workflow's shell runs with `bash -e`, and a failing
            # command inside `VAR=$(...)` on its own line still aborts the
            # whole script under -e even if the very next line checks $?;
            # only testing the assignment directly (or `... || true`)
            # actually suppresses that.
            if ! INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" \
              --output json 2>&1); then
              # A real API error (throttling, not-yet-registered invocation,
              # etc) — log it instead of silently calling it Pending, so a
              # genuine problem here is visible rather than looking like a
              # hang.
              echo "get-command-invocation error (will retry): $INVOCATION"
              STATUS="Pending"
            else
              STATUS=$(echo "$INVOCATION" | jq -r ".Status")
            fi
            echo "Status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "--- stdout ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" --query "StandardOutputContent" --output text
                echo "--- stderr ---"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" --query "StandardErrorContent" --output text
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the deploy command to finish"
          exit 1